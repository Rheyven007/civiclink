<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CivicLink</title>

    (function () { var d = document.documentElement.dataset;
      d.theme = localStorage.getItem('civiclink.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  </script>
</head>
